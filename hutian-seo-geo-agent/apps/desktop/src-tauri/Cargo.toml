[package]
name = "hutian-desktop"
version = "0.1.0"
description = "壶天 SEO/GEO Agent 桌面版"
authors = ["Hutian"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hutian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
