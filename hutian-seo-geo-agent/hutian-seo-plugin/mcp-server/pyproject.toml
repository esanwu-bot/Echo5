[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hutian-seo-mcp"
version = "0.1.0"
description = "Hutian SEO/GEO MCP server: diagnosis, citation tracking, sitemap submission, schema validation and JSON-LD generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hutian" }]
keywords = ["seo", "geo", "schema.org", "mcp", "json-ld", "indexnow"]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "openserp==0.2.6",
    "httpx>=0.27.0",
    "markdownify>=0.11.0",
]
# playwright 为可选依赖：仅 render_mode=auto 时尝试 import，失败降级为仅标记空壳
# 安装：pip install "hutian-seo-mcp[render]" 或 pip install playwright && playwright install chromium
[project.optional-dependencies]
render = ["playwright>=1.40.0"]

[project.scripts]
hutian-seo-mcp = "hutian_seo_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["hutian_seo_mcp"]
